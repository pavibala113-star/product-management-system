<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Welcome Message</title>

  <style>

    body{
      font-family: Arial, sans-serif;
      height: 100vh;

      display: flex;
      justify-content: center;
      align-items: center;
    }

    .container{
      text-align: center;
    }

    input{
      padding: 10px;
      width: 220px;
      font-size: 16px;
    }

    button{
      padding: 10px 20px;
      margin-left: 10px;
      cursor: pointer;
    }

    h1{
      margin-top: 20px;
      color: blueviolet;
    }

  </style>

</head>

<body>

  <div class="container">

    <!-- Input Box -->

    <input
      type="text"
      id="nameInput"
      placeholder="Enter Your Name"
    >

    <!-- Button -->

    <button onclick="showMessage()">
      Submit
    </button>

    <!-- Output -->

    <h1 id="result"></h1>

  </div>

  <script>

    function showMessage(){

      let name =
      document.getElementById("nameInput").value;

      document.getElementById("result").innerText =
      "Welcome " + name;

    }

  </script>

</body>

</html>
