<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Product List</title>
 
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }
 
    body {
      background: #f4f7fc;
      padding: 40px;
    }
 
    h1 {
      text-align: center;
      margin-bottom: 40px;
      color: #1e293b;
    }
 
    .products-container {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 25px;
      max-width: 1400px;
      margin: auto;
    }
 
    .product-card {
      background: white;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 5px 15px rgba(0,0,0,0.1);
      transition: transform 0.3s ease;
    }
 
    .product-card:hover {
      transform: translateY(-5px);
    }
 
    .product-image {
      width: 100%;
      height: 220px;
      object-fit: cover;
    }
 
    .product-content {
      padding: 20px;
    }
 
    .product-name {
      font-size: 20px;
      font-weight: bold;
      color: #1e293b;
      margin-bottom: 12px;
    }
 
    .product-price {
      display: inline-block;
      padding: 8px 15px;
      border-radius: 20px;
      background: linear-gradient(135deg, #2563eb, #7c3aed);
      color: white;
      font-weight: bold;
      margin-bottom: 15px;
    }
 
    .loading {
      text-align: center;
      font-size: 22px;
      font-weight: bold;
      margin-top: 100px;
    }
  </style>
</head>
<body>
 
  <h1>Product Store</h1>
 
  <div id="loading" class="loading">Loading Products...</div>
 
  <div id="products" class="products-container"></div>
 
  <script>
    async function loadProducts() {
      try {
        const response = await fetch(
          "https://6a322ccb7bc5e1c61266a35f.mockapi.io/api/v1/products"
        );
 
        const products = await response.json();
 
        document.getElementById("loading").style.display = "none";
 
        const container = document.getElementById("products");
 
        products.forEach(product => {
          const card = document.createElement("div");
          card.className = "product-card";
 
          card.innerHTML = `
            <img
              src="${product.avatar}"
              alt="${product.name}"
              class="product-image"
            />
 
            <div class="product-content">
              <div class="product-name">${product.name}</div>
 
              <div class="product-price">
                ₹ ${product.price}
              </div>
            </div>
          `;
 
          container.appendChild(card);
        });
      } catch (error) {
        document.getElementById("loading").innerHTML =
          "Failed to load products.";
        console.error(error);
      }
    }
 
    loadProducts();
  </script>
 
</body>
</html>
