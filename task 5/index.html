<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fruit Array Add</title>

  <style>

    body{
      font-family: Arial, sans-serif;
      padding: 40px;
    }

    h1{
      margin-bottom: 20px;
    }

    input{
      padding: 10px;
      width: 220px;
      font-size: 16px;
    }

    button{
      padding: 10px 20px;
      margin-left: 10px;
      cursor: pointer;
    }

    p{
      font-size: 20px;
      margin-top: 10px;
    }

  </style>

</head>

<body>

  <h1>Fruit Names</h1>

  <!-- Fruits Display -->

  <div id="result"></div>

<br>
  <!-- Input -->
  <input
    type="text"
    id="fruitInput"
    placeholder="Enter Fruit Name"
  >

  <!-- Button -->

  <button onclick="addFruit()">
    Add
  </button>

  <script>

    // Fruits array

    let fruits = ["Apple","Mango","Orange"];

    // Display Fruits names

    function showFruits(){

      let output = "";
// Loop
      for(let i = 0; i < fruits.length; i++){

        output += `<p>${fruits[i]}</p>`;

      }
      document.getElementById("result").innerHTML =
      output;

    }

    // Add Fruit

     function addFruit(){

  let newFruit =
  document.getElementById("fruitInput").value;

  fruits.push(newFruit);

  showFruits();

  document.getElementById("fruitInput").value = "";
     }


//  Display output
    showFruits();
  </script>

</body>

</html>
