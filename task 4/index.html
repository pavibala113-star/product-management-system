<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Fruits  names</title>

  <style>

    body{
      font-family: Arial, sans-serif;
      padding: 40px;
    }

    h1{
      margin-bottom: 20px;
    }

    p{
      font-size: 20px;
      margin-bottom: 10px;
    }

  </style>

</head>

<body>

  <h1>Fruit Names</h1>

  <div id="result"></div>

  <script>

    // Fruits Array

    let fruits = ["Apple","Mango","Orange","Banana","Grapes"];

    // Empty Variable

    let output = "";

    // Loop

    for(let i = 0; i < fruits.length; i++){

      output += `<p>${fruits[i]}</p>`;

    }
    // Display Output
    document.getElementById("result").innerHTML =
    output;

  </script>

</body>

</html>
